<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terço Online</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav id="navbar">
            <h1 class="nav_brand">
                <a href="#" data-route="inicio" title="Ir para a página inicial">
                    <span class="encadeado_terco">
                        <span class="cruz_logo">┼</span>
                        <span class="conta_terco"></span>
                        <span class="conta_terco"></span>
                        <span class="logo_terco">Terço</span>
                        <span class="conta_terco"></span>
                        <span class="conta_terco"></span>
                    </span>
                    <span class="logo_online">Online</span>
                </a>
            </h1>
            <ul class="nav_list">
                <li class="nav_item">
                    <a href="#" data-route="gozosos" data-misterio="gozosos">
                        <span class="nome_misterio">Mistérios Gozosos</span>
                        <span class="dias_menu">(Segundas e Quintas)</span>
                    </a>
                </li>
                <li class="nav_item">
                    <a href="#" data-route="dolorosos" data-misterio="dolorosos">
                        <span class="nome_misterio">Mistérios Dolorosos</span>
                        <span class="dias_menu">(Terças e Sextas)</span>
                    </a>
                </li>
                <li class="nav_item">
                    <a href="#" data-route="gloriosos" data-misterio="gloriosos">
                        <span class="nome_misterio">Mistérios Gloriosos</span>
                        <span class="dias_menu">(Quartas e Sábados)</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="texto_oracao_inicial">
            <!-- Preenchido via JS com a História do Terço -->
        </section>

        <section id="conteudo_misterio">
            <p class="mensagem_ajuda">Selecione um mistério no menu acima para ler as contemplações.</p>
        </section>
    </main>

    <footer>
        <p class="footer_item">Louvado seja Nosso Senhor Jesus Cristo</p>
    </footer>

    <script src="assets/js/script.js"></script>
    <!-- Modal para Ampliar Imagens -->
    <div id="modal_imagem" class="lightbox_modal">
        <span class="lightbox_fechar" id="fechar_modal">&times;</span>
        <img class="lightbox_conteudo" id="imagem_ampliada" src="" alt="Imagem Ampliada">
    </div>
</body>
</html>
